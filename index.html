<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narda's Market</title>
    <link rel="icon" href="images/favicon_market/favicon.ico">
    <link rel="manifest" href="/site.webmanifest">
    <link href="./style.css" rel="stylesheet">
</head>
<body class='body'>
    <section class='main'>
        <section class='market'>
            <h1 class='market-title'>Fruits</h1>
            <div class='market-product'>
                <div class='market-product_content'>
                    <div class='market-product_subcontent'>
                        <img class='product-image' src="./images/product_market/kiwi.png" alt="kiwi">
                    </div>
                    <button class='car-buy'>
                        <img class='car-image' src="./images/product_market/car.png">
                        <span class='car-name'>Adicionar</span>
                    </button>
                    <div class='product-title'>
                        <p class='product-name'>Kiwi</p>
                        <h2>Kiwi Organico</h2>
                        <span class='product-price'>R$8,00</span>
                    </div>
                </div>
                <div class='market-product_content'>
                    <div class='market-product_subcontent'>
                        <img class='product-image' src="./images/product_market/banana.png" alt="banana">
                    </div>
                    <button class='car-buy'>
                        <img class='car-image' src="./images/product_market/car.png">
                        <span class='car-name'>Adicionar</span>
                    </button>
                    <div class='product-title'>
                        <p class='product-name'>Banana</p>
                        <h2>Banana Nanica</h2>
                        <span class='product-price'>R$2,00</span>
                    </div>
                </div>
                <div class='market-product_content'>
                    <div class='market-product_subcontent'>
                        <img class='product-image' src="./images/product_market/laranja.png" alt="laranja">
                    </div>    
                    <button class='car-buy'>
                        <img class='car-image' src="./images/product_market/car.png">
                        <span class='car-name'>Adicionar</span>
                    </button>
                    <div class='product-title'>
                        <p class='product-name'>Laranja</p>
                        <h2>Laranja Pera</h2>
                        <span class='product-price'>R$5,00</span>
                    </div>
                </div>
                <div class='market-product_content'>
                    <div class='market-product_subcontent'>
                        <img class='product-image' src="./images/product_market/lichia.png" alt="lichia">
                    </div> 
                    <button class='car-buy'>
                        <img class='car-image' src="./images/product_market/car.png">
                        <span class='car-name'>Adicionar</span>
                    </button>
                    <div class='product-title'>
                        <p class='product-name'>Lichia</p>
                        <h2>Lichia Importada</h2>
                        <span class='product-price'>R$13,00</span>
                    </div>
                </div>
                <div class='market-product_content'>
                    <div class='market-product_subcontent'>
                        <img class='product-image' src="./images/product_market/manga.png" alt="manga">
                    </div>
                    <button class='car-buy'>
                        <img class='car-image' src="./images/product_market/car.png">
                        <span class='car-name'>Adicionar</span>
                    </button>
                    <div class='product-title'>
                        <p class='product-name'>Manga</p>
                        <h2>Manga Palmer</h2>
                        <span class='product-price'>R$10,00</span>
                    </div>
                </div>
                <div class='market-product_content'>
                    <div class='market-product_subcontent'>
                        <img class='product-image' src="./images/product_market/melancia.png" alt="melancia">
                    </div>
                    <button class='car-buy'>
                        <img class='car-image' src="./images/product_market/car.png">
                        <span class='car-name'>Adicionar</span>
                    </button>
                    <div class='product-title'>
                        <p class='product-name'>Melancia</p>
                        <h2>Melancia Baby</h2>
                        <span class='product-price'>R$3,00</span>
                    </div>
                </div>  
            </div>
        </section>
        <section class='my-car'>
            <h2 class='car-number'>Minhas Compras ( 0 )</h2>
            <div class='image-car'>
                <img class='car-result' src="./images/product_market/carrinho.png">
            </div>
            <div>
                <p class='subtitle-car'>Os itens adicionados aparecerão aqui</p>
            </div>
        </section>
    </section>
</body>
</html>
